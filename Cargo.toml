[package]
name = "addresses_rs"
version = "0.5.0"
description = "Local contact management and printable address-label PDFs."
license = "MIT"
edition = "2024"
rust-version = "1.89"
authors = ["D. W. Jongepier <djongepier@gmail.com>"]

[dependencies]
anyhow = "1.0.104"
csv = "1.4.0"
directories = "6.0.0"
gpui = "0.2.2"
printpdf = { version = "0.12.9", default-features = false }
rusqlite = { version = "0.43.0", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
unicode-segmentation = "1.12.0"

[build-dependencies]
winres = "0.1.12"
